name: GitHub Actions Example
on: 
  [push,pull_request]		
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: install dependencies
        run: make install
        
      - name: check code quality(Pylint)
        run: make lint
      
      - name: run tests
        run: make test
